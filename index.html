<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion CPR</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:system-ui,sans-serif;text-align:center}
#wrap{position:relative;width:min(96vw,720px);margin:12px auto}
video,canvas{width:100%;border-radius:12px;transform:scaleX(-1)}
canvas{position:absolute;left:0;top:0}
button{font-size:18px;padding:12px 24px;margin:12px;border:0;border-radius:10px;background:#e53935;color:#fff}
</style>
</head>
<body>
<h1>Motion CPR</h1>
<button id="start">Включить камеру</button>
<div id="status"></div>
<div id="wrap"><video id="v" autoplay playsinline muted></video><canvas id="c"></canvas></div>
<script type="module">
import {PoseLandmarker, FilesetResolver, DrawingUtils} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const v=document.getElementById('v'), c=document.getElementById('c'), st=document.getElementById('status');
const ctx=c.getContext('2d'), du=new DrawingUtils(ctx);
let pose;
document.getElementById('start').onclick=async()=>{
  try{
    st.textContent='Загрузка модели...';
    const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    pose=await PoseLandmarker.createFromOptions(fs,{
      baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"},
      runningMode:"VIDEO", numPoses:1});
    v.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:640,height:480}});
    await v.play();
    c.width=v.videoWidth; c.height=v.videoHeight;
    st.textContent='Камера работает';
    loop();
  }catch(e){ st.textContent='Ошибка: '+e.message; }
};
function loop(){
  const res=pose.detectForVideo(v,performance.now());
  ctx.clearRect(0,0,c.width,c.height);
  for(const lm of res.landmarks){
    du.drawConnectors(lm,PoseLandmarker.POSE_CONNECTIONS);
    du.drawLandmarks(lm,{radius:3});
  }
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
